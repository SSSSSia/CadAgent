name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tool
        run: python -m pip install ruff
      - name: Compile
        run: python -m compileall -q agent core ui tests InitGui.py Init.py
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest tests/ -q --tb=line
